[project]
name = "pombo-backend"
version = "0.1.0"
description = "FastAPI backend for Pombo"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "pydantic-settings>=2.3.0",
  "email-validator>=2.1.0",
  "pyjwt>=2.9.0",
  "cryptography>=42.0.0",
  "asyncpg>=0.29.0",
  "argon2-cffi>=23.1.0",
  "google-generativeai>=0.3.0",
]

[dependency-groups]
dev = []
